"$schema" = 'https://starship.rs/config-schema.json'

# One Dark: duas linhas, sem depender de glifos de Nerd Fonts.
add_newline = true
command_timeout = 800
format = "$directory$git_branch$git_status$python$nodejs$rust$cmd_duration$line_break$character"

[directory]
style = "bold #82c8ff"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = true
read_only = " (somente leitura)"
read_only_style = "#ff8a93"

[git_branch]
symbol = "git:"
style = "#d7a5ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "#e5c07b"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "! "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "
untracked = "?${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "-${count} "

[python]
symbol = "py "
style = "#e5c07b"
format = '[${symbol}${version}( \($virtualenv\))]($style) '

[nodejs]
symbol = "node "
style = "#a6e3a1"
format = "[$symbol$version]($style) "

[rust]
symbol = "rust "
style = "#d19a66"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#b8c4d6"
format = "[· $duration]($style) "

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #ff8a93)"
vimcmd_symbol = "[❮](bold #82c8ff)"
